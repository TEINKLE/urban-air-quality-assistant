<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Air Quality Assistant | Gen AI Powered</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --bg: #f0fdf4;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #475569;
      --border: #cbd5e1;
      --pill: #ccfbf1;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.25rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      color: var(--primary-dark);
      font-size: 1.9rem;
      margin-bottom: 0.35rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.98rem;
    }

    .tag {
      display: inline-block;
      background: var(--pill);
      color: var(--primary-dark);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      margin-bottom: 1.4rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 620px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    input, textarea, select {
      width: 100%;
      padding: 0.72rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: #ffffff;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .api-box {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      padding: 0.9rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .helper-text {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 0.78rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--primary-dark);
      outline-offset: 2px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
      margin-top: 1rem;
    }

    @media (max-width: 680px) {
      .metrics {
        grid-template-columns: 1fr;
      }
    }

    .metric-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.9rem;
    }

    .metric-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-top: 0.25rem;
    }
